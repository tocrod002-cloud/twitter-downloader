
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f8">
<title>X 影片下載器</title>

<style>
:root {
  --blue: #20a4ec;
  --gray: #708390;
  --pink: #e91e60;
  --bg: #f4f6f8;
  --text: #29333b;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
}
body {
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont,
    "PingFang TC", "Noto Sans TC", Arial, sans-serif;
  color: var(--text);
  padding: calc(74px + env(safe-area-inset-top))
    16px 40px;
  -webkit-font-smoothing: antialiased;
}
.card {
  max-width: 780px;
  margin: auto;
  background: white;
  border-radius: 22px;
  padding: 38px 38px 42px;
  box-shadow: 0 7px 20px rgba(35,45,52,.14);
}
h1 {
  text-align: center;
  color: var(--blue);
  font-size: clamp(30px, 7vw, 43px);
  font-weight: 750;
  margin: 0 0 38px;
}
.input-row {
  display: grid;
  grid-template-columns: minmax(0,1fr) auto auto;
  gap: 12px;
}
#urlInput {
  width: 100%;
  min-width: 0;
  height: 60px;
  padding: 0 16px;
  border: 2px solid #bdc2c6;
  border-radius: 14px;
  background: white;
  color: var(--text);
  font-size: 16px;
  outline: none;
  -webkit-appearance: none;
}
#urlInput:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(32,164,236,.12);
}
button, .download-button {
  border: none;
  border-radius: 13px;
  font-family: inherit;
  font-weight: 650;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.paste, .clear {
  height: 60px;
  min-width: 96px;
  padding: 0 16px;
  color: white;
  font-size: 18px;
}
.paste { background: var(--gray); }
.clear { background: var(--pink); }
.primary {
  width: 100%;
  height: 76px;
  margin-top: 35px;
  background: var(--blue);
  color: white;
  font-size: 22px;
  box-shadow: inset 0 -4px rgba(0,0,0,.04);
}
.primary:disabled {
  opacity: .65;
  cursor: wait;
}
.message {
  display: none;
  margin-top: 20px;
  padding: 15px;
  border-radius: 12px;
  font-size: 15px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
.message.info {
  display: block;
  color: #52616b;
  background: #f0f4f7;
}
.message.error {
  display: block;
  color: #b21947;
  background: #fff0f3;
}
.results {
  display: none;
  margin-top: 24px;
}
.results.show { display: block; }
.meta {
  color: #697780;
  font-size: 14px;
  margin-bottom: 15px;
}
.media-list {
  display: grid;
  gap: 14px;
}
.media-item {
  display: grid;
  grid-template-columns: 84px minmax(0,1fr);
  gap: 13px;
  padding: 13px;
  border: 1px solid #e1e5e9;
  border-radius: 15px;
  background: white;
}
.thumbnail {
  width: 84px;
  height: 84px;
  border-radius: 11px;
  object-fit: cover;
  background: #edf1f4;
}
.media-name {
  font-size: 18px;
  font-weight: 700;
  padding-top: 7px;
}
.media-detail {
  margin-top: 7px;
  font-size: 13px;
  line-height: 1.5;
  color: #87929b;
}
.download-button {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 55px;
  color: white;
  background: var(--blue);
  font-size: 17px;
  text-decoration: none;
}
.note {
  color: #969ea5;
  font-size: 12px;
  line-height: 1.5;
  margin-top: 16px;
}
@media (max-width: 600px) {
  .card {
    padding: 34px 18px 30px;
  }
  h1 { margin-bottom: 33px; }
  .input-row {
    grid-template-columns: minmax(0,1fr) 74px 74px;
    gap: 10px;
  }
  #urlInput {
    height: 57px;
    padding: 0 13px;
  }
  .paste, .clear {
    height: 57px;
    min-width: 0;
    padding: 0 5px;
    font-size: 17px;
  }
  .primary {
    height: 72px;
    margin-top: 30px;
  }
}
</style>
</head>

<body>
<main class="card">
  <h1>X 影片下載器</h1>

  <div class="input-row">
    <input
      id="urlInput"
      type="url"
      inputmode="url"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="貼上 X 或 Twitter 連結..."
    >
    <button class="paste" id="pasteBtn">貼上</button>
    <button class="clear" id="clearBtn">清除</button>
  </div>

  <button class="primary" id="fetchBtn">
    獲取影片
  </button>

  <div id="message" class="message" role="status"></div>

  <section id="results" class="results">
    <div id="meta" class="meta"></div>
    <div id="mediaList" class="media-list"></div>
    <div class="note">
      僅支援公開 X 帖子。請只下載你有權保存或使用的內容。
    </div>
  </section>
</main>

<script>
"use strict";

const input = document.getElementById("urlInput");
const pasteBtn = document.getElementById("pasteBtn");
const clearBtn = document.getElementById("clearBtn");
const fetchBtn = document.getElementById("fetchBtn");
const message = document.getElementById("message");
const results = document.getElementById("results");
const meta = document.getElementById("meta");
const mediaList = document.getElementById("mediaList");

const X_HOSTS = new Set([
  "x.com",
  "www.x.com",
  "twitter.com",
  "www.twitter.com",
  "mobile.twitter.com",
  "m.twitter.com"
]);

function hideKeyboard() {
  input.blur();
}

function showMessage(text, type = "info") {
  message.textContent = text;
  message.className = "message " + type;
}

function clearMessage() {
  message.textContent = "";
  message.className = "message";
}

function clearResults() {
  results.classList.remove("show");
  meta.textContent = "";
  mediaList.replaceChildren();
}

function parsePost(raw) {
  let url;

  try {
    const text = raw.trim();
    url = new URL(
      /^https?:\/\//i.test(text)
        ? text
        : "https://" + text
    );
  } catch {
    throw new Error("請貼上有效的 X 帖子連結");
  }

  if (
    !["https:", "http:"].includes(url.protocol) ||
    !X_HOSTS.has(url.hostname.toLowerCase())
  ) {
    throw new Error("只支援 X / Twitter 帖子連結");
  }

  const match = url.pathname.match(
    /\/(?:status|statuses)\/(\d+)(?:\/|$)/
  );

  if (!match) {
    throw new Error("找不到帖子 ID，請使用完整連結");
  }

  return {
    id: match[1],
    url: url.toString()
  };
}

function number(value) {
  const n = Number(value);
  return Number.isFinite(n) && n > 0 ? n : 0;
}

function dimensions(variant) {
  let width = number(variant.width);
  let height = number(variant.height);

  if (!width || !height) {
    const match = String(variant.url || "").match(
      /\/(\d{2,5})x(\d{2,5})(?:\/|$)/
    );

    if (match) {
      width = Number(match[1]);
      height = Number(match[2]);
    }
  }

  return { width, height };
}

function isAllowedMedia(raw, hostname) {
  try {
    const u = new URL(raw);
    return u.protocol === "https:" &&
      u.hostname === hostname;
  } catch {
    return false;
  }
}

function getBestVideo(item) {
  const formats = Array.isArray(item.formats)
    ? item.formats
    : [];

  const mp4s = formats.filter(f => {
    if (!f?.url ||
        !isAllowedMedia(f.url, "video.twimg.com")) {
      return false;
    }

    const container = String(
      f.container || ""
    ).toLowerCase();

    return container === "mp4" ||
      container === "video/mp4" ||
      (!container && /\.mp4(?:\?|$)/i.test(f.url));
  });

  if (
    mp4s.length === 0 &&
    isAllowedMedia(item.url, "video.twimg.com") &&
    /\.mp4(?:\?|$)/i.test(item.url)
  ) {
    mp4s.push(item);
  }

  mp4s.sort((a, b) => {
    const da = dimensions(a);
    const db = dimensions(b);

    return (
      db.width * db.height -
      da.width * da.height
    ) || (
      number(b.bitrate) - number(a.bitrate)
    ) || (
      number(b.size) - number(a.size)
    );
  });

  return mp4s[0] || null;
}

function getOriginalPhoto(raw) {
  try {
    const u = new URL(raw);

    if (
      u.protocol !== "https:" ||
      u.hostname !== "pbs.twimg.com"
    ) {
      return null;
    }

    u.searchParams.set("name", "orig");
    return u.toString();
  } catch {
    return null;
  }
}

function photoExtension(raw, fallback) {
  const allowed = ["jpg", "jpeg", "png", "webp"];
  let format = String(fallback || "").toLowerCase();

  try {
    const u = new URL(raw);
    const queryFormat = (
      u.searchParams.get("format") || ""
    ).toLowerCase();

    if (allowed.includes(queryFormat)) {
      format = queryFormat;
    } else if (!allowed.includes(format)) {
      const match = u.pathname.match(
        /\.(jpg|jpeg|png|webp)$/i
      );
      format = match ? match[1].toLowerCase() : "jpg";
    }
  } catch {
    format = "jpg";
  }

  return format === "jpeg" ? "jpg" : format;
}

function extractMedia(status) {
  const media = status.media || {};

  const all = Array.isArray(media.all) &&
    media.all.length > 0
      ? media.all
      : [
          ...(Array.isArray(media.photos)
            ? media.photos : []),
          ...(Array.isArray(media.videos)
            ? media.videos : [])
        ];

  const output = [];
  const seen = new Set();
  let photoCount = 0;
  let videoCount = 0;

  for (const item of all) {
    if (!item || typeof item !== "object") continue;

    const type = String(item.type || "").toLowerCase();

    if (type === "photo") {
      const url = getOriginalPhoto(item.url);

      if (!url || seen.has(url)) continue;
      seen.add(url);

      photoCount++;

      output.push({
        type: "photo",
        label: "相片 " + photoCount,
        url,
        preview: item.url || url,
        width: number(item.width),
        height: number(item.height),
        format: photoExtension(url, item.format)
      });

    } else if (
      type === "video" ||
      type === "gif" ||
      type === "animated_gif"
    ) {
      const best = getBestVideo(item);

      if (!best || seen.has(best.url)) continue;
      seen.add(best.url);

      videoCount++;

      const d = dimensions(best);

      output.push({
        type: type === "video" ? "video" : "gif",
        label:
          (type === "video" ? "影片 " : "GIF ") +
          videoCount,
        url: best.url,
        preview: item.thumbnail_url || "",
        width: d.width || number(item.width),
        height: d.height || number(item.height),
        bitrate: number(best.bitrate),
        format: "mp4"
      });

    } else if (type === "mosaic_photo") {
      const mosaic =
        item.formats?.jpeg ||
        item.formats?.webp;

      const url = getOriginalPhoto(mosaic);

      if (!url || seen.has(url)) continue;
      seen.add(url);

      photoCount++;

      output.push({
        type: "photo",
        label: "相片 " + photoCount,
        url,
        preview: mosaic,
        width: number(item.width),
        height: number(item.height),
        format: photoExtension(url)
      });
    }
  }

  return output;
}

async function fetchWithTimeout(url, options, ms) {
  const controller = new AbortController();
  const timer = setTimeout(
    () => controller.abort(), ms
  );

  try {
    return await fetch(url, {
      ...options,
      signal: controller.signal
    });
  } finally {
    clearTimeout(timer);
  }
}

/*
 * 優先：Safari 直接連接 FxTwitter。
 * 不經 Cloudflare Worker 出口 IP。
 *
 * 不加自訂 request headers，
 * 避免額外 CORS preflight。
 */
async function directParse(post) {
  const endpoint =
    "https://api.fxtwitter.com/2/status/" +
    encodeURIComponent(post.id);

  const response = await fetchWithTimeout(
    endpoint,
    {
      method: "GET",
      mode: "cors",
      credentials: "omit",
      cache: "no-store"
    },
    12000
  );

  if (!response.ok) {
    throw new Error(
      "FxTwitter HTTP " + response.status
    );
  }

  const data = await response.json();

  if (
    Number(data.code) !== 200 ||
    !data.status ||
    data.status.type === "tombstone"
  ) {
    throw new Error(
      data.message || "帖子無法公開讀取"
    );
  }

  const media = extractMedia(data.status);

  if (!media.length) {
    throw new Error(
      "沒有找到可下載的 MP4 或圖片"
    );
  }

  return {
    ok: true,
    source: "Safari 直接解析",
    post: {
      author: {
        username:
          data.status.author?.screen_name ||
          data.status.author?.username ||
          "",
        name: data.status.author?.name || ""
      }
    },
    media
  };
}

/*
 * Safari 直接連線失敗時，
 * 自動使用原有 Cloudflare /api 備援。
 */
async function workerParse(post) {
  const endpoint =
    "/api?url=" + encodeURIComponent(post.url);

  const response = await fetchWithTimeout(
    endpoint,
    {
      method: "GET",
      cache: "no-store",
      headers: {
        Accept: "application/json"
      }
    },
    28000
  );

  const data = await response.json();

  if (!response.ok || !data.ok) {
    throw new Error(
      data.error ||
      "Cloudflare 解析失敗：" + response.status
    );
  }

  if (!Array.isArray(data.media) || !data.media.length) {
    throw new Error("找不到可下載媒體");
  }

  return data;
}

function makeDownloadUrl(item, index) {
  const u = new URL(item.url);

  if (
    u.protocol !== "https:" ||
    !["video.twimg.com", "pbs.twimg.com"].includes(
      u.hostname
    )
  ) {
    return null;
  }

  const isPhoto = item.type === "photo";

  const ext = isPhoto
    ? photoExtension(item.url, item.format)
    : "mp4";

  const filename = isPhoto
    ? `X-photo-${index + 1}.${ext}`
    : `X-video-${index + 1}.mp4`;

  const params = new URLSearchParams({
    url: item.url,
    filename
  });

  return "/download?" + params.toString();
}

function mediaDetail(item) {
  const resolution =
    item.width && item.height
      ? `${item.width} × ${item.height}`
      : "最高可用版本";

  if (item.type === "photo") {
    return resolution + " · " +
      String(item.format || "JPG").toUpperCase();
  }

  const bitrate = number(item.bitrate);

  return resolution +
    (bitrate
      ? " · " + (bitrate / 1000000).toFixed(2) +
        " Mbps"
      : "") +
    " · MP4";
}

function renderResults(data) {
  clearResults();

  const author = data.post?.author || {};
  const username = author.username
    ? "@" + author.username
    : author.name || "X 帖子";

  meta.textContent =
    username + " · 找到 " +
    data.media.length + " 個可下載媒體";

  data.media.forEach((item, index) => {
    const downloadUrl = makeDownloadUrl(item, index);

    if (!downloadUrl) return;

    const card = document.createElement("article");
    card.className = "media-item";

    const thumb = document.createElement("img");
    thumb.className = "thumbnail";
    thumb.loading = "lazy";
    thumb.alt = item.label || "媒體預覽";

    const preview = item.preview ||
      (item.type === "photo" ? item.url : "");

    if (preview) thumb.src = preview;

    thumb.onerror = () => {
      thumb.style.opacity = ".15";
    };

    const info = document.createElement("div");

    const title = document.createElement("div");
    title.className = "media-name";
    title.textContent = item.label || "媒體 " + (index + 1);

    const detail = document.createElement("div");
    detail.className = "media-detail";
    detail.textContent = mediaDetail(item);

    info.append(title, detail);

    const link = document.createElement("a");
    link.className = "download-button";
    link.href = downloadUrl;
    link.textContent = item.type === "photo"
      ? "下載原圖"
      : "下載影片";

    link.setAttribute("download", "");
    link.setAttribute("rel", "nofollow");

    card.append(thumb, info, link);
    mediaList.appendChild(card);
  });

  if (!mediaList.children.length) {
    throw new Error("沒有找到有效的媒體下載網址");
  }

  results.classList.add("show");
}

async function getMedia() {
  hideKeyboard();

  const raw = input.value.trim();

  if (!raw) {
    showMessage("請先貼上 X 帖子連結", "error");
    return;
  }

  clearMessage();
  clearResults();

  let post;

  try {
    post = parsePost(raw);
  } catch (error) {
    showMessage(error.message, "error");
    return;
  }

  fetchBtn.disabled = true;
  fetchBtn.textContent = "正在解析...";

  try {
    let data;
    let directError = null;

    try {
      data = await directParse(post);
    } catch (error) {
      directError = error;
    }

    if (!data) {
      fetchBtn.textContent = "正在嘗試備援解析...";

      try {
        data = await workerParse(post);
      } catch (workerError) {
        console.error("Safari:", directError);
        console.error("Worker:", workerError);

        throw new Error(
          "解析失敗。Safari 直接解析：" +
          (directError?.message || "連線失敗") +
          "；Cloudflare 備援：" +
          workerError.message
        );
      }
    }

    renderResults(data);

    showMessage(
      "成功找到 " + data.media.length +
      " 個媒體，已選擇最高可用 MP4 畫質。" +
      "（" + (data.source || "解析成功") + "）",
      "info"
    );

  } catch (error) {
    showMessage(
      error.message || "解析失敗，請稍後再試",
      "error"
    );

  } finally {
    fetchBtn.disabled = false;
    fetchBtn.textContent = "獲取影片";
  }
}

pasteBtn.addEventListener("click", async () => {
  hideKeyboard();
  clearMessage();

  try {
    const text = await navigator.clipboard.readText();

    if (text?.trim()) {
      input.value = text.trim();
      hideKeyboard();
      clearResults();
    } else {
      showMessage("剪貼簿沒有文字");
    }
  } catch {
    hideKeyboard();
    showMessage(
      "Safari 沒有允許讀取剪貼簿，請長按輸入框手動貼上"
    );
  }
});

clearBtn.addEventListener("click", () => {
  input.value = "";
  hideKeyboard();
  clearMessage();
  clearResults();
});

fetchBtn.addEventListener("click", getMedia);

input.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    hideKeyboard();
    getMedia();
  }
});
</script>
</body>
</html>
