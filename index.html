<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="theme-color" content="#f4f6f8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <title>X 影片下載器</title>

  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;

      --blue: #21a7ed;
      --blue-dark: #1397dc;

      --slate: #6f8290;
      --pink: #e91f5f;

      --text: #27313a;
      --muted: #8d979f;
      --line: #d9dee2;

      --shadow: 0 7px 18px rgba(41, 54, 63, 0.16);

      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "PingFang TC",
        "PingFang HK",
        "Noto Sans TC",
        "Helvetica Neue",
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;

      padding:
        calc(74px + env(safe-area-inset-top))
        16px
        calc(34px + env(safe-area-inset-bottom));
    }

    .shell {
      width: min(100%, 780px);
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);

      padding: 38px 40px 42px;
    }

    h1 {
      margin: 0 0 38px;

      text-align: center;

      color: var(--blue);

      font-size: clamp(31px, 7.5vw, 43px);

      letter-spacing: 0.02em;

      font-weight: 750;
    }

    .input-row {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        auto
        auto;

      gap: 14px;

      align-items: stretch;
    }

    input {
      width: 100%;

      min-height: 58px;

      padding: 0 20px;

      border: 1.5px solid #bfc5c9;

      border-radius: 13px;

      font-size: 18px;

      color: var(--text);

      outline: none;

      background: #fff;

      appearance: none;
      -webkit-appearance: none;
    }

    input::placeholder {
      color: #aaaeb2;
    }

    input:focus {
      border-color: var(--blue);

      box-shadow:
        0 0 0 3px rgba(33, 167, 237, 0.12);
    }

    button,
    .download-btn {
      min-height: 58px;

      border: 0;

      border-radius: 13px;

      font: inherit;

      font-size: 18px;

      font-weight: 650;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;
    }

    button:active,
    .download-btn:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.62;

      cursor: default;

      transform: none;
    }

    .paste {
      padding: 0 23px;

      color: #fff;

      background: var(--slate);
    }

    .clear {
      padding: 0 23px;

      color: #fff;

      background: var(--pink);
    }

    .primary {
      width: 100%;

      margin-top: 36px;

      min-height: 74px;

      color: #fff;

      background: var(--blue);

      font-size: 22px;

      box-shadow:
        inset 0 -4px 0 rgba(0, 0, 0, 0.04);
    }

    .primary:hover {
      background: var(--blue-dark);
    }

    .message {
      display: none;

      margin: 18px 2px 0;

      padding: 13px 14px;

      border-radius: 11px;

      background: #f6f8fa;

      color: #59636b;

      font-size: 15px;

      line-height: 1.45;
    }

    .message.error {
      display: block;

      background: #fff0f3;

      color: #b41346;
    }

    .message.info {
      display: block;
    }

    .results {
      display: none;

      margin-top: 24px;
    }

    .results.show {
      display: block;
    }

    .post-meta {
      margin: 0 2px 12px;

      color: #65717a;

      font-size: 14px;

      line-height: 1.45;
    }

    .media-list {
      display: grid;

      gap: 14px;
    }

    .media-item {
      display: grid;

      grid-template-columns:
        82px
        minmax(0, 1fr)
        auto;

      gap: 14px;

      align-items: center;

      padding: 12px;

      border: 1px solid #e3e7ea;

      border-radius: 15px;

      background: #fff;
    }

    .thumb {
      width: 82px;
      height: 82px;

      object-fit: cover;

      border-radius: 11px;

      background: #eef2f5;
    }

    .media-title {
      font-weight: 700;

      font-size: 17px;
    }

    .media-sub {
      margin-top: 5px;

      color: var(--muted);

      font-size: 13px;
    }

    .download-btn {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-width: 104px;

      padding: 0 16px;

      text-decoration: none;

      color: #fff;

      background: var(--blue);

      white-space: nowrap;
    }

    .note {
      margin: 16px 2px 0;

      color: #929aa1;

      font-size: 12px;

      line-height: 1.45;
    }

    @media (max-width: 640px) {

      body {
        padding-top:
          calc(78px + env(safe-area-inset-top));
      }

      .card {
        padding: 34px 18px 30px;

        border-radius: 20px;
      }

      h1 {
        margin-bottom: 32px;
      }

      .input-row {
        grid-template-columns:
          minmax(0, 1fr)
          74px
          74px;

        gap: 10px;
      }

      input {
        min-height: 56px;

        padding: 0 14px;

        font-size: 16px;
      }

      .paste,
      .clear {
        padding: 0 8px;

        min-height: 56px;

        font-size: 17px;
      }

      .primary {
        margin-top: 30px;

        min-height: 70px;
      }

      .media-item {
        grid-template-columns:
          68px
          minmax(0, 1fr);
      }

      .thumb {
        width: 68px;
        height: 68px;
      }

      .download-btn {
        grid-column: 1 / -1;

        width: 100%;

        min-height: 52px;
      }
    }
  </style>
</head>

<body>

  <main class="shell">

    <section class="card">

      <h1>X 影片下載器</h1>

      <div class="input-row">

        <input
          id="url"
          type="url"
          inputmode="url"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="貼上 X 或 Twitter 連結..."
          aria-label="X 帖子連結"
        />

        <button
          class="paste"
          id="pasteBtn"
          type="button"
        >
          貼上
        </button>

        <button
          class="clear"
          id="clearBtn"
          type="button"
        >
          清除
        </button>

      </div>

      <button
        class="primary"
        id="fetchBtn"
        type="button"
      >
        獲取影片
      </button>

      <div
        id="message"
        class="message"
        role="status"
        aria-live="polite"
      ></div>

      <section
        id="results"
        class="results"
        aria-live="polite"
      >

        <div
          id="postMeta"
          class="post-meta"
        ></div>

        <div
          id="mediaList"
          class="media-list"
        ></div>

        <div class="note">
          只支援公開 X 帖子。請僅下載你有權保存或使用的內容。
        </div>

      </section>

    </section>

  </main>


  <script>

    const input =
      document.getElementById("url");

    const pasteBtn =
      document.getElementById("pasteBtn");

    const clearBtn =
      document.getElementById("clearBtn");

    const fetchBtn =
      document.getElementById("fetchBtn");

    const message =
      document.getElementById("message");

    const results =
      document.getElementById("results");

    const postMeta =
      document.getElementById("postMeta");

    const mediaList =
      document.getElementById("mediaList");


    function showMessage(
      text,
      type = "info"
    ) {

      message.textContent = text;

      message.className =
        `message ${type}`;
    }


    function hideMessage() {

      message.textContent = "";

      message.className = "message";
    }


    function resetResults() {

      results.classList.remove("show");

      postMeta.textContent = "";

      mediaList.innerHTML = "";
    }


    function proxiedDownloadUrl(rawUrl) {

      try {

        const u =
          new URL(rawUrl);


        if (
          u.hostname ===
          "video.twimg.com"
        ) {

          return (
            "/download/video" +
            u.pathname +
            u.search
          );
        }


        if (
          u.hostname ===
          "pbs.twimg.com"
        ) {

          return (
            "/download/photo" +
            u.pathname +
            u.search
          );
        }


        return rawUrl;

      } catch {

        return rawUrl;
      }
    }


    function resolutionText(item) {

      const r =
        item.width &&
        item.height

          ? `${item.width} × ${item.height}`

          : "原始／最高可用畫質";


      if (
        item.type === "video" &&
        item.bitrate
      ) {

        return (
          `${r} · ` +
          `${(
            item.bitrate /
            1000000
          ).toFixed(1)} Mbps · MP4`
        );
      }


      return (
        `${r} · ` +
        `${(
          item.format || ""
        ).toUpperCase()}`
      );
    }


    function render(data) {

      resetResults();


      const author =
        data.post?.author || {};


      const who =
        author.username

          ? `@${author.username}`

          : (
              author.name ||
              "X 帖子"
            );


      postMeta.textContent =
        `${who} · 找到 ` +
        `${data.media.length} 個可下載媒體`;


      data.media.forEach(
        (item, index) => {

          const row =
            document.createElement(
              "article"
            );

          row.className =
            "media-item";


          const img =
            document.createElement(
              "img"
            );

          img.className =
            "thumb";

          img.alt =
            `${item.label || "媒體"}預覽`;

          img.loading =
            "lazy";

          img.src =
            item.preview ||
            (
              item.type === "photo"
                ? item.url
                : ""
            );


          img.onerror = () => {

            img.style.visibility =
              "hidden";
          };


          const info =
            document.createElement(
              "div"
            );


          const title =
            document.createElement(
              "div"
            );

          title.className =
            "media-title";

          title.textContent =
            item.label ||
            `媒體 ${index + 1}`;


          const sub =
            document.createElement(
              "div"
            );

          sub.className =
            "media-sub";

          sub.textContent =
            resolutionText(item);


          info.append(
            title,
            sub
          );


          const a =
            document.createElement(
              "a"
            );

          a.className =
            "download-btn";

          a.href =
            proxiedDownloadUrl(
              item.url
            );


          a.textContent =
            item.type === "photo"

              ? "下載原圖"

              : "下載影片";


          a.setAttribute(
            "rel",
            "nofollow"
          );


          row.append(
            img,
            info,
            a
          );


          mediaList.appendChild(
            row
          );
        }
      );


      results.classList.add(
        "show"
      );
    }


    async function fetchMedia() {

      const url =
        input.value.trim();


      if (!url) {

        showMessage(
          "請先貼上 X / Twitter 帖子連結。",
          "error"
        );

        input.focus();

        return;
      }


      resetResults();

      hideMessage();


      fetchBtn.disabled =
        true;

      fetchBtn.textContent =
        "正在獲取...";


      try {

        const res =
          await fetch(
            "/api?url=" +
            encodeURIComponent(url),
            {
              method: "GET",

              headers: {
                "Accept":
                  "application/json"
              },

              cache:
                "no-store"
            }
          );


        const data =
          await res
            .json()
            .catch(
              () => ({})
            );


        if (
          !res.ok ||
          !data.ok
        ) {

          throw new Error(
            data.error ||
            `取得失敗（HTTP ${res.status}）`
          );
        }


        render(data);


        showMessage(
          "已取得最高可用畫質。點擊下方下載按鈕即可。",
          "info"
        );

      } catch (err) {

        showMessage(
          err?.message ||
          "取得失敗，請稍後再試。",
          "error"
        );

      } finally {

        fetchBtn.disabled =
          false;

        fetchBtn.textContent =
          "獲取影片";
      }
    }


    pasteBtn.addEventListener(
      "click",
      async () => {

        hideMessage();


        try {

          const text =
            await navigator.clipboard
              .readText();


          if (text) {

            input.value =
              text.trim();

            input.focus();

          } else {

            showMessage(
              "剪貼簿目前沒有文字。",
              "info"
            );
          }

        } catch {

          input.focus();

          showMessage(
            "Safari 沒有允許讀取剪貼簿，請長按輸入框後選擇「貼上」。",
            "info"
          );
        }
      }
    );


    clearBtn.addEventListener(
      "click",
      () => {

        input.value = "";

        hideMessage();

        resetResults();

        input.focus();
      }
    );


    fetchBtn.addEventListener(
      "click",
      fetchMedia
    );


    input.addEventListener(
      "keydown",
      (e) => {

        if (
          e.key === "Enter"
        ) {

          fetchMedia();
        }
      }
    );

  </script>

</body>
</html>
